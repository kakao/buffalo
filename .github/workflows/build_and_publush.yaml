name: Build and publish distribution

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} / py${{ matrix.python-version }} / ${{ matrix.cibw-arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: [38, 39, 310, 311]
        cibw-arch: [auto, aarch64]
        exclude:
          # Do not build wheel for linux-aarch64 temporarily
          - os: ubuntu-latest
            cibw-arch: aarch64
          - os: macos-latest
            cibw-arch: aarch64

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all
    
    - name: Install openblas
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt update && sudo apt install -y libopenblas-dev
        elif [ "$RUNNER_OS" == "macOS" ]; then
          brew install openblas
        fi
      shell: bash
      
    - name: Build wheels
      uses: pypa/cibuildwheel@v2.19.0
      env:
        CIBW_BUILD: cp${{ matrix.python-version }}-*
        CIBW_ARCHS_LINUX: ${{ matrix.cibw-arch }}
        CIBW_ARCHS_MACOS: ${{ matrix.cibw-arch }}
        CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET_arm64='14.0' MACOSX_DEPLOYMENT_TARGET_universal2='14.0' MACOSX_DEPLOYMENT_TARGET_x86_64='10.13'"

    - name: Build sdist
      run: |
        pip install build
        python -m build . --sdist -o wheelhouse
      if: ${{ runner.os == 'Linux' && matrix.python-version == '311' && matrix.cibw-arch == 'auto' }}

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.cibw-arch }}
        path: wheelhouse
        if-no-files-found: warn

  publish:
    name: Publish
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')

    steps:
    - name: Download all wheel/sdist artifacts
      uses: actions/download-artifact@v4
      with:
        path: all_dist_artifacts

    - name: Set up Python for publishing
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install twine
      run: pip install twine

    - name: List downloaded files for verification
      run: |
        echo "Downloaded artifacts structure under all_dist_artifacts/:"
        ls -R all_dist_artifacts

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        find all_dist_artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -print
        find all_dist_artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -print0 | xargs -0 --no-run-if-empty twine upload --skip-existing
